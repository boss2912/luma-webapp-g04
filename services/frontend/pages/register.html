<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMA — สมัครสมาชิก</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body data-page="register">
  <header class="app-header">
    <div id="app-nav-slot"></div>
  </header>

  <main class="app-main">
    <div class="auth-container">
      <div class="auth-header">
        <h1>สมัครสมาชิก LUMA</h1>
        <p>สร้างบัญชีเพื่อเริ่มต้นสร้างและจัดเก็บผลงาน AI</p>
      </div>

      <div id="register-error" class="auth-alert auth-alert--error" hidden role="alert"></div>
      <div id="register-success" class="auth-alert auth-alert--success" hidden role="status"></div>

      <form id="register-form" class="auth-form" action="javascript:void(0);" novalidate>
        <div class="form-group">
          <label for="email">อีเมล *</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="example@domain.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="displayName">ชื่อแสดงผล *</label>
          <input
            type="text"
            id="displayName"
            name="displayName"
            class="form-control"
            placeholder="เช่น สมชาย ใจดี"
            required
            autocomplete="nickname"
          />
        </div>

        <div class="form-group">
          <label for="password">รหัสผ่าน (อย่างน้อย 8 ตัวอักษร) *</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="••••••••"
            required
            minlength="8"
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">ยืนยันรหัสผ่าน *</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-control"
            placeholder="••••••••"
            required
            minlength="8"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" id="register-submit" class="auth-btn">
          สมัครสมาชิก
        </button>
      </form>

      <div class="auth-footer">
        มีบัญชีผู้ใช้อยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
      </div>
    </div>
  </main>

  <form id="logout-form" action="#" method="post" hidden></form>

  <script src="../js/layout.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
