<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMA — เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body data-page="login" class="auth-page">
  <div class="auth-card">
    <a class="auth-card__brand" href="index.html">LUMA</a>

    <form class="auth-form" id="login-form" novalidate>
      <p class="auth-error" id="login-error" hidden role="alert"></p>

      <div class="auth-field">
        <label class="auth-field__label" for="login-email">อีเมล</label>
        <input
          class="auth-field__input"
          type="email"
          id="login-email"
          name="email"
          autocomplete="username"
          required
        />
      </div>

      <div class="auth-field">
        <label class="auth-field__label" for="login-password">รหัสผ่าน</label>
        <input
          class="auth-field__input"
          type="password"
          id="login-password"
          name="password"
          autocomplete="current-password"
          required
        />
      </div>

      <button class="auth-submit" type="submit" id="login-submit">
        เข้าสู่ระบบ
      </button>
    </form>

    <p class="auth-footer">
      ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a>
    </p>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
