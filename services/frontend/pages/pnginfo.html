<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMA — PNG Info</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/generate.css" />
  <link rel="stylesheet" href="../css/pnginfo.css" />
</head>
<body data-page="pnginfo">
  <header class="app-header">
    <div id="app-nav-slot"></div>
  </header>

  <main class="app-main">
    <h1>PNG Info</h1>
    <p>ใส่ไฟล์ PNG แล้วดู prompt/ค่าที่ใช้สร้างภาพ ถ้ามีฝังอยู่ในไฟล์ — ใช้ได้กับ PNG
      จากที่ไหนก็ได้ ไม่ใช่แค่ภาพในคลังผลงานของแอปนี้</p>

    <div class="generate-layout">
      <section class="generate-form-card">
        <div class="generate-error" id="pi-error" hidden role="alert"></div>

        <div class="form-group">
          <label for="pi-upload">ไฟล์ PNG *</label>
          <input class="form-control" type="file" id="pi-upload" accept="image/png" />
          <span class="form-hint">รองรับเฉพาะ .png — ไฟล์ที่ไม่ใช่ PNG จะไม่มี chunk แบบนี้ฝังอยู่</span>
        </div>

        <button type="button" class="btn-generate" id="pi-submit" disabled>อ่านข้อมูล</button>
      </section>

      <section class="generate-preview-card">
        <div class="preview-container" id="pi-preview-container">
          <p class="preview-placeholder" id="pi-placeholder">เลือกไฟล์ PNG เพื่อเริ่ม</p>
          <img class="preview-image" id="pi-preview-img" alt="ภาพที่เลือก" hidden />
        </div>

        <div class="pi-result" id="pi-result" hidden>
          <h3 id="pi-result-title"></h3>
          <pre class="pi-parameters" id="pi-parameters"></pre>
        </div>
      </section>
    </div>
  </main>

  <form id="logout-form" action="#" method="post" hidden></form>

  <script src="../js/csrf.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pnginfo.js"></script>
</body>
</html>
